name: Deploy site

# Code lives on `main`; the generated data lives on the `data` branch (force-pushed by pipeline/publish.sh,
# so the repository history does not grow with every data refresh). Each run combines the two.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - name: Site data
        run: mkdir -p web/public/data && cp -r _data/site/. web/public/data/ && ls -la web/public/data
      - name: Embedding model (same one used to embed the illustrations)
        run: |
          M=web/public/models/Xenova/bge-small-en-v1.5
          mkdir -p $M/onnx
          U=https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/main
          for f in config.json tokenizer.json tokenizer_config.json special_tokens_map.json onnx/model_quantized.onnx; do
            curl -fsSL --retry 3 -o $M/$f $U/$f
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
